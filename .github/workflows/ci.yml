name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: The Table
        run: docker build -t theroundtable:test .

      - name: Run PHPUnit tests in Docker
        run: docker run --rm theroundtable:test vendor/bin/phpunit --configuration phpunit.xml

      - name: Cache config & routes
        run: |
          docker run --rm theroundtable:test php artisan config:cache
          docker run --rm theroundtable:test php artisan route:cache

