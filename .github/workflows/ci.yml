name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: The Table
        run: docker build -t theroundtable:test .

      - name: Run PHPUnit tests in Docker
        run: docker run --rm theroundtable:test php vendor/bin/phpunit --configuration /var/www/html/phpunit.xml

      - name: Run artisan config:cache & route:cache
        run: docker run --rm theroundtable:test php artisan config:cache && docker run --rm theroundtable:test php artisan route:cache

      - name: Health check endpoint test
        run: |
          docker run -d --name health-test -p 8000:9000 theroundtable:test
          sleep 3
          curl -f http://127.0.0.1:8000/health || exit 1
          docker stop health-test

