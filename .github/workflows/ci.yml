name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: theroundtable_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - uses: actions/checkout@v4
      - name: Cache vendor directory
        uses: actions/cache@v4
        with:
          path: The Table/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('The Table/composer.lock') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip
      - name: Install dependencies
        working-directory: The Table
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Prepare test DB
        working-directory: The Table
        run: |
          touch /tmp/database.sqlite
          php artisan migrate --force --no-interaction
      - name: Run tests
        working-directory: The Table
        run: vendor/bin/phpunit --configuration phpunit.xml
