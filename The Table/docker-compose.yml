version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: theroundtable-app:latest
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PUID=1000
      - PGID=1000
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      - db
    networks:
      - trt-net

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: theroundtable
      MYSQL_USER: trt
      MYSQL_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - trt-net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./configs/theroundtable-vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - trt-net

  php-fpm-health:
    image: busybox
    command: sh -c 'while sleep 30; do nc -z app 9000 && echo OK || echo NOK; done'
    depends_on:
      - app
    networks:
      - trt-net

volumes:
  db-data:

networks:
  trt-net:
    driver: bridge
